; ─────────────────────────────────────────────────────────────────────────────
; EzISMS — de drie processen van de app-container
;
; supervisord is PID 1. Dat wijkt af van de "één proces per container"-leer, en
; dat is hier de juiste afweging: dit is een uitgeleverd product bij één klant op
; één server, geen schaalbare cloudopzet. Eén ding om te herstarten, één ding om
; uit te leggen. En supervisord ruimt zombies op.
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

; ezisms-fpm is de symlink die de Dockerfile naar de php-fpm van deze reeks legt.
; Zonder --fpm-config gebruikt php-fpm zijn eigen ingebouwde pad, dus ook hier
; staat geen versienummer.
[program:php-fpm]
command=/usr/local/sbin/ezisms-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; De planning staat in routes/console.php; hier alleen de wekker. schedule:work
; roept intern elke minuut schedule:run aan — geen crontab nodig, en cron zit
; niet in dit image.
;
; startsecs=30: een scheduler die meteen weer omvalt is een echt probleem
; (verval-gebruikersaccounts, controleer-audittrail, genereer-taken, meet-kpis),
; en de KPI-meethistorie is niet reconstrueerbaar. Liever een container die
; luidruchtig faalt dan een die stil geen metingen meer doet.
[program:scheduler]
command=/usr/bin/php /opt/ezisms/artisan schedule:work
user=www-data
directory=/opt/ezisms
environment=HOME="/tmp",XDG_CONFIG_HOME="/tmp/.config",XDG_CACHE_HOME="/tmp/.cache"
autorestart=true
startsecs=30
priority=30
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
