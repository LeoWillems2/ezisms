; ─────────────────────────────────────────────────────────────────────────────
; EzISMS — de php-fpm pool
;
; Eén pool, die als www-data draait — dezelfde gebruiker die storage/ bezit.
; De meegeleverde pool www.conf is uit het image verwijderd: twee pools maakt
; onvaststelbaar welke de site bedient.
; ─────────────────────────────────────────────────────────────────────────────

; De socketnaam is van ons en draagt bewust géén PHP-versie: nginx wijst hem aan
; en hoeft dan niet mee te veranderen als de distributie een reeks opschuift.
; Het versienummer staat alleen in de Dockerfile (ARG PHP_REEKS).

[ezisms]
user = www-data
group = www-data
listen = /run/php/ezisms-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M

; 512M vanwege de exports en, in deel 2, `isms:demo-vul`.
php_admin_value[memory_limit] = 512M

; Naar stderr, zodat een fatale fout in `docker compose logs` staat en niet
; alleen in een bestand dat niemand opent.
php_admin_value[error_log] = /dev/stderr
catch_workers_output = yes
decorate_workers_output = no
