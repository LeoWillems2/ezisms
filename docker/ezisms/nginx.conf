# ─────────────────────────────────────────────────────────────────────────────
# EzISMS — het serverblok
#
# Deze container bedient één site en kent zijn eigen hostnaam niet, vandaar
# `server_name _` met default_server. De TLS wordt door HAProxy getermineerd;
# hier komt uitsluitend HTTP binnen.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;
    root /opt/ezisms/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;
    client_max_body_size 64m;

    # Toegang tot gevoelige bestandsextensies blokkeren
    location ~* \.(log|json|lock|sql|bak|ini|env)$ { deny all; return 404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # De socket wordt benoemd in php-fpm-pool.conf en draagt geen
        # PHP-versie, zodat dit bestand niet meeverandert bij een reeksupgrade.
        fastcgi_pass unix:/run/php/ezisms-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # HAProxy termineert de TLS. De applicatie kent geen TrustProxies-
        # configuratie, dus dít is het HTTPS-besef: zonder deze constructie
        # genereert Laravel achter de proxy http://-URL's.
        set $my_https "";
        if ($http_x_forwarded_proto = "https") { set $my_https "on"; }
        fastcgi_param HTTPS $my_https;

        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # Naar de containerlogs, zodat `docker compose logs app` het toegangslog
    # toont. De Laravel-logs gaan NIET hierheen: die staan in storage/logs op de
    # hostmap, overleven de container, en zijn waar een auditor kijkt.
    #
    # Deze twee regels gelden alleen bínnen dit serverblok. De master-logs van
    # nginx staan in /etc/nginx/nginx.conf en worden door de Dockerfile naar
    # dezelfde streams omgelegd — zonder dat verdwijnt een configuratiefout in
    # de container, juist wanneer nginx niet start (implementatie/00p §2).
    #
    # De logdriver roteert (compose.yml, `local` met max-size × max-file) en
    # verliest dus ook: hij bewaart ongeveer tien dagen en gaat weg bij het
    # opnieuw aanmaken van de container. Dat is bewust — wat moet blijven, hoort
    # op de hostmap of in de database.
    access_log /dev/stdout;
    error_log  /dev/stderr;
}
