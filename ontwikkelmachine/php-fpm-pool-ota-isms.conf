; php-fpm-pool voor de ISMS-ontwikkelsite (ismsota.lewi.nl).
;
; WAAROM EEN EIGEN POOL
; Op deze machine draaien acht nginx-sites op de gedeelde pool `www` als
; www-data. Dit project is de enige waarin óók artisan en de testsuite
; schrijven, en wel als `leo`. Twee accounts met verschillende umasks in
; dezelfde storage/-boom vroeg om ACL's, en die vielen stil op de mask: een map
; die een van beide op 0700 aanmaakt zet `mask::---` en daarmee elke benoemde
; ACL-entry op `#effective:---`. Livewire's map voor tijdelijke uploads
; (storage/app/private/livewire-tmp) deed precies dat, waarna leo niet meer bij
; zijn eigen projectmap kon.
;
; Eén schrijvend account is de oplossing die productie (scripts/deploy.sh) en de
; container (docker/ezisms/entrypoint.sh) al gebruiken. Daar is dat www-data;
; hier is het `leo`, omdat die artisan en de tests interactief draait. Daarmee
; is er op alle drie de plekken één schrijver en zijn er nergens meer ACL's.
;
; ALLEEN VOOR DEZE ONTWIKKELMACHINE. Op een doelmachine draait php-fpm als
; www-data en bezit dat account storage/; de code is daar van een apart account
; dat niets draait. Zie scripts/deploy.sh :: zet_rechten().
;
; De andere zeven sites blijven ongemoeid op de pool `www`.

[ota-isms]

user = leo
group = leo

; Eigen socket; `www` houdt /run/php/php8.4-fpm.sock.
listen = /run/php/php8.4-fpm-ota-isms.sock

; De socket is van de pool-gebruiker en wordt aangesproken door nginx, dat als
; www-data draait — vandaar de groep en 0660. Het proces eráchter draait als
; leo, en dat is het hele punt van deze pool.
listen.owner = leo
listen.group = www-data
listen.mode = 0660

; Gelijk aan de pool `www`; dit is een ontwikkelsite met één gebruiker.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
